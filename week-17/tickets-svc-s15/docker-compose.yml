services:
  tickets-grpc:
    build: ./tickets-grpc
    container_name: tickets-grpc
    ports:
      - "50051:50051"
    restart: unless-stopped
    networks:
      - tickets-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',50051)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

  tickets-api:
    build: ./tickets-api
    container_name: tickets-api
    ports:
      - "8144:8144"
    depends_on:
      tickets-grpc:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tickets-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8144/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

  nginx:
    image: nginx:alpine
    container_name: tickets-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      tickets-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tickets-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tickets-network:
    driver: bridge