<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebRTC Чат - comments-s15</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; }
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #input { width: 80%; padding: 10px; }
        #send { padding: 10px 20px; }
        #status { color: gray; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>WebRTC Чат</h1>
    <p>Project: comments-s15</p>
    <div id="status">Подключение...</div>
    <div id="chat"></div>
    <input id="input" type="text" placeholder="Введите сообщение..." disabled />
    <button id="send" disabled>Отправить</button>

    <script>
        const status = document.getElementById('status');
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        const ws = new WebSocket(`ws://${location.host}/ws/room1`);
        let pc;
        let dataChannel;
        let useWebRTC = false;

        function addMessage(prefix, text) {
            const div = document.createElement('div');
            div.textContent = prefix + ': ' + text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function enableChat() {
            input.disabled = false;
            sendBtn.disabled = false;
        }

        function sendMessage() {
            const text = input.value;
            if (!text) return;
            if (useWebRTC && dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(text);
            } else {
                ws.send(JSON.stringify({ type: 'chat', text: text }));
            }
            addMessage('Я', text);
            input.value = '';
        }

        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        pc = new RTCPeerConnection(config);

        dataChannel = pc.createDataChannel('chat');
        dataChannel.onopen = () => {
            useWebRTC = true;
            status.textContent = 'Соединение P2P установлено (WebRTC)';
            enableChat();
        };
        dataChannel.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                addMessage('Собеседник (P2P)', msg.text);
            } catch {
                addMessage('Собеседник (P2P)', e.data);
            }
        };

        pc.onicecandidate = (e) => {
            if (e.candidate) {
                ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
            }
        };

        pc.ondatachannel = (e) => {
            dataChannel = e.channel;
            dataChannel.onmessage = (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    addMessage('Собеседник (P2P)', msg.text);
                } catch {
                    addMessage('Собеседник (P2P)', ev.data);
                }
            };
        };

        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                useWebRTC = false;
                status.textContent = 'P2P не удалось, используется WebSocket';
                enableChat();
            }
        };

        ws.onopen = () => {
            status.textContent = 'Подключено к серверу, устанавливаю P2P...';
            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                ws.send(JSON.stringify(offer));
            });
        };

        ws.onmessage = async (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(msg));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify(answer));
            } else if (msg.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(msg));
            } else if (msg.type === 'candidate') {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                } catch (err) {
                    console.log('ICE candidate error:', err);
                }
            } else if (msg.type === 'chat') {
                addMessage('Собеседник', msg.text);
            }
        };

        setTimeout(() => {
            if (!useWebRTC) {
                status.textContent = 'P2P не установлено, используется WebSocket';
                enableChat();
            }
        }, 3000);

        sendBtn.onclick = sendMessage;
        input.onkeypress = (e) => {
            if (e.key === 'Enter') sendBtn.click();
        };
    </script>
</body>
</html>
